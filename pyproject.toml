[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sp500-cufolio"
version = "0.1.0"
description = "CPU portfolio optimization with minute-to-daily return aggregation"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

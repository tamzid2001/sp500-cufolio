name: 24/7 five-minute paper runner

# The legacy filename is retained so queued self-handoffs and the watchdog
# replace the former hourly strategy instead of starting a second runner.
on:
  workflow_dispatch:
    inputs:
      run_seconds:
        description: "Continuous paper-runner slice; 20700 seconds is 5h45m."
        type: string
        default: "20700"

permissions:
  contents: write
  actions: write

concurrency:
  group: cufolio-five-minute-paper-24x7-singleton
  cancel-in-progress: false

jobs:
  paper-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      RUN_SECONDS: ${{ inputs.run_seconds || '20700' }}
      FULL_UNIVERSE_CACHE_DIR: var/full_alpaca_universe_five_minute
      LIVE_ENDPOINT_CACHE: var/full_alpaca_universe_live_five_minute_endpoints.csv.gz
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install five-minute paper-runner dependencies
        run: pip install -r requirements.txt

      - name: Resolve the required completed-session cache date
        id: completed_session
        run: |
          set -euo pipefail
          test -n "$ALPACA_API_KEY"
          test -n "$ALPACA_SECRET_KEY"
          evaluation_end="$(python tools/cache_full_alpaca_five_minute_input.py \
            --cache-dir "$FULL_UNIVERSE_CACHE_DIR" --print-latest-completed-session)"
          echo "evaluation_end=$evaluation_end" >> "$GITHUB_OUTPUT"
          echo "FIVE MINUTE FULL-UNIVERSE CACHE REQUIRED | evaluation_end=$evaluation_end"

      - name: Restore rolling full-universe endpoint cache
        id: minute_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: var/full_alpaca_universe_live_five_minute_endpoints.csv.gz
          key: five-minute-paper-full-alpaca-endpoint-history-${{ github.run_id }}
          restore-keys: |
            five-minute-paper-full-alpaca-endpoint-history-

      - name: Restore verified full-Alpaca historical endpoint cache
        id: full_universe_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: var/full_alpaca_universe_five_minute
          key: full-alpaca-iex-1m-endpoints-${{ steps.completed_session.outputs.evaluation_end }}-${{ hashFiles('tools/cache_full_alpaca_five_minute_input.py') }}
          restore-keys: |
            full-alpaca-iex-1m-endpoints-

      - name: Report paper-runner handoff configuration
        env:
          CACHE_HIT: ${{ steps.minute_cache_restore.outputs.cache-hit }}
          FULL_UNIVERSE_CACHE_HIT: ${{ steps.full_universe_cache_restore.outputs.cache-hit }}
        run: |
          cache_status=miss
          if test "$CACHE_HIT" = "true"; then
            cache_status=exact-hit
          elif test -f "$LIVE_ENDPOINT_CACHE"; then
            cache_status=rolling-hit
          fi
          test -s "$FULL_UNIVERSE_CACHE_DIR/alpaca_tradable_fractionable_universe.csv"
          test -s "$FULL_UNIVERSE_CACHE_DIR/iex_one_minute_exact_five_minute_endpoints.csv.gz"
          echo "FIVE MINUTE PAPER HANDOFF STARTED | run=${GITHUB_RUN_ID} sha=${GITHUB_SHA} mode=paper slice=${RUN_SECONDS}s rolling_cache=${cache_status} full_cache_restore=${FULL_UNIVERSE_CACHE_HIT:-prefix-or-miss} required_evaluation_end=${{ steps.completed_session.outputs.evaluation_end }}"

      - name: Verify the full-universe cache is fresh and intact
        env:
          EVALUATION_END: ${{ steps.completed_session.outputs.evaluation_end }}
        run: |
          set -euo pipefail
          python tools/cache_full_alpaca_five_minute_input.py \
            --cache-dir "$FULL_UNIVERSE_CACHE_DIR" \
            --evaluation-end "$EVALUATION_END" \
            --verify-existing

      - name: Verify causal five-minute paper cadence
        run: pytest -q tests/test_alpaca.py tests/test_five_minute_paper_session.py tests/test_intraday_forecast_audits.py tests/test_optimization.py

      - name: Run paper-only five-minute session handoff slice
        run: |
          set -euo pipefail
          test -n "$ALPACA_API_KEY"
          test -n "$ALPACA_SECRET_KEY"
          publish_checkpoint_loop() {
            while true; do
              python tools/publish_five_minute_checkpoint.py \
                --source var/five_minute_paper_24x7_state.json \
                --repository "$GITHUB_WORKSPACE" \
                --branch main || echo "FIVE MINUTE CHECKPOINT PUBLISH DEFERRED | will retry in 60 seconds"
              sleep 60
            done
          }
          publish_checkpoint_loop &
          publisher_pid=$!
          cleanup() {
            runner_status=$?
            trap - EXIT INT TERM
            kill "$publisher_pid" 2>/dev/null || true
            wait "$publisher_pid" 2>/dev/null || true
            python tools/publish_five_minute_checkpoint.py \
              --source var/five_minute_paper_24x7_state.json \
              --repository "$GITHUB_WORKSPACE" \
              --branch main || echo "FIVE MINUTE CHECKPOINT FINAL PUBLISH DEFERRED"
            exit "$runner_status"
          }
          trap cleanup EXIT INT TERM
          python -m cufolio_cpu.five_minute_paper_daemon \
            --run-seconds "$RUN_SECONDS" \
            --state var/five_minute_paper_24x7_state.json \
            --minute-cache "$LIVE_ENDPOINT_CACHE" \
            --historical-minute-cache "$FULL_UNIVERSE_CACHE_DIR/iex_one_minute_exact_five_minute_endpoints.csv.gz" \
            --universe-cache "$FULL_UNIVERSE_CACHE_DIR/alpaca_tradable_fractionable_universe.csv" \
            --history-calendar-days 55 \
            --output-dir artifacts/five_minute_paper_24x7 \
            --top-n 20 \
            --max-weight 0.10

      - name: Persist five-minute paper handoff state
        if: always()
        run: |
          set -euo pipefail
          python tools/publish_five_minute_checkpoint.py \
            --source var/five_minute_paper_24x7_state.json \
            --repository "$GITHUB_WORKSPACE" \
            --branch main

      - name: Check full-universe endpoint cache for handoff
        if: always()
        id: minute_cache_present
        run: |
          if test -f "$LIVE_ENDPOINT_CACHE"; then
            echo "save=true" >> "$GITHUB_OUTPUT"
            echo "FIVE MINUTE PAPER CACHE HANDOFF READY | bytes=$(wc -c < "$LIVE_ENDPOINT_CACHE")"
          else
            echo "save=false" >> "$GITHUB_OUTPUT"
            echo "FIVE MINUTE PAPER CACHE HANDOFF EMPTY | no cache was created in this slice."
          fi

      - name: Save rolling full-universe endpoint cache
        if: always() && steps.minute_cache_present.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: var/full_alpaca_universe_live_five_minute_endpoints.csv.gz
          key: five-minute-paper-full-alpaca-endpoint-history-${{ github.run_id }}

      - name: Queue the next 5h45m paper handoff
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run hourly-paper-24x7.yml --repo "$GITHUB_REPOSITORY" --ref main -f run_seconds=20700
          echo "FIVE MINUTE PAPER HANDOFF QUEUED | paper-only next 5h45m slice."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-minute-paper-24x7-${{ github.run_id }}
          path: |
            var/five_minute_paper_24x7_state.json
            var/full_alpaca_universe_live_five_minute_endpoints.csv.gz
            artifacts/five_minute_paper_24x7/
          if-no-files-found: warn
          retention-days: 30

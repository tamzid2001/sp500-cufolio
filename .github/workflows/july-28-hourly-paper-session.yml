name: July 28 hourly causal paper session

on:
  # Starts at 09:45 ET to prefetch history before the first 10:30 decision.
  # It stays on the GitHub-hosted runner and ends by flattening at 15:30 ET.
  schedule:
    - cron: "45 13 28 7 *"
  workflow_dispatch:
    inputs:
      session_date:
        description: "New York market session date"
        type: string
        default: "2026-07-28"
      history_start:
        description: "UTC start for completed one-hour training outcomes"
        type: string
        default: "2026-06-01T13:30:00Z"
      top_n:
        description: "Maximum selected S&P 500 assets"
        type: string
        default: "20"
      max_weight:
        description: "Maximum paper portfolio weight per asset"
        type: string
        default: "0.10"

permissions:
  contents: read

concurrency:
  group: cufolio-paper-session-singleton
  cancel-in-progress: false

jobs:
  paper-session:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      SESSION_DATE: ${{ inputs.session_date || '2026-07-28' }}
      HISTORY_START: ${{ inputs.history_start || '2026-06-01T13:30:00Z' }}
      TOP_N: ${{ inputs.top_n || '20' }}
      MAX_WEIGHT: ${{ inputs.max_weight || '0.10' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install paper-session dependencies
        run: pip install -r requirements.txt
      - name: Verify hourly paper session schedule
        run: pytest -q tests/test_hourly_paper_session.py tests/test_hourly_intraday_backtest.py
      - name: Run paper-only hourly candidate and rebalance loop
        run: |
          test -n "$ALPACA_API_KEY"
          test -n "$ALPACA_SECRET_KEY"
          python -m cufolio_cpu.hourly_paper_session \
            --session-date "$SESSION_DATE" \
            --history-start "$HISTORY_START" \
            --output-dir artifacts/july_28_hourly_paper_session \
            --top-n "$TOP_N" \
            --max-weight "$MAX_WEIGHT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: july-28-hourly-paper-session-ledger
          path: artifacts/july_28_hourly_paper_session
          if-no-files-found: warn

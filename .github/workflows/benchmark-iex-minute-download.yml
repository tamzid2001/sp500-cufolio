name: Benchmark 503-symbol IEX minute download

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install market-data dependencies
        run: pip install -r requirements.txt

      - name: Time the latest completed one-minute IEX request
        run: |
          set -euo pipefail
          test -n "$ALPACA_API_KEY"
          test -n "$ALPACA_SECRET_KEY"
          python - <<'PY'
          from datetime import timedelta
          from time import perf_counter

          import pandas as pd

          from cufolio_cpu.alpaca import download_minute_bars
          from cufolio_cpu.five_minute_intraday_backtest import NEW_YORK, SESSION_CLOSE
          from cufolio_cpu.universe import current_sp500_universe


          def latest_regular_session(now: pd.Timestamp) -> pd.Timestamp:
              day = now.date()
              while day.weekday() >= 5:
                  day -= timedelta(days=1)
              return pd.Timestamp.combine(day, SESSION_CLOSE).tz_localize(NEW_YORK).tz_convert("UTC")


          universe_started = perf_counter()
          symbols = current_sp500_universe()["symbol"].tolist()
          universe_elapsed = perf_counter() - universe_started
          if len(symbols) != 503:
              raise RuntimeError(f"expected 503 current S&P 500 share classes, received {len(symbols)}")
          end = latest_regular_session(pd.Timestamp.now(tz=NEW_YORK))
          start = end - timedelta(minutes=1)
          durations = []
          for sample in range(1, 4):
              started = perf_counter()
              bars = download_minute_bars(symbols, start, end)
              elapsed = perf_counter() - started
              durations.append(elapsed)
              print(
                  "IEX 503-MINUTE DOWNLOAD | "
                  f"sample={sample}/3 elapsed_seconds={elapsed:.3f} requested_symbols={len(symbols)} "
                  f"returned_symbols={bars['symbol'].nunique()} rows={len(bars)} "
                  f"start={start.isoformat()} end={end.isoformat()}",
                  flush=True,
              )
          print(
              "IEX 503-MINUTE DOWNLOAD SUMMARY | "
              f"universe_lookup_seconds={universe_elapsed:.3f} min_seconds={min(durations):.3f} "
              f"median_seconds={float(pd.Series(durations).median()):.3f} max_seconds={max(durations):.3f}",
              flush=True,
          )
          PY

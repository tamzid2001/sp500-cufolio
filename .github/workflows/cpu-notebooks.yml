name: CPU notebooks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      data_source:
        description: "Synthetic CI data, yfinance research data, or optional Alpaca minute-bar download"
        type: choice
        default: synthetic
        options: [synthetic, yfinance, alpaca]
      universe_file:
        description: "Repository CSV with a symbol column"
        type: string
        default: assets/universe.example.csv
      universe_source:
        description: "Use a repository universe file or fetch current S&P 500 constituents from Wikipedia"
        type: choice
        default: repository
        options: [repository, sp500_wikipedia]
      start:
        description: "UTC start; 1m supports up to 8 days and 15m up to 60 days"
        type: string
        default: "2026-06-01"
      end:
        description: "UTC end"
        type: string
        default: "2026-07-27"
      yfinance_interval:
        description: "Yahoo Finance intraday interval"
        type: choice
        default: "15m"
        options: ["1m", "15m"]
      max_weight:
        description: "Maximum research portfolio weight; use >= 1 / usable assets"
        type: string
        default: "0.30"

permissions:
  contents: read

jobs:
  test-and-execute-notebooks:
    if: github.event_name != 'workflow_dispatch' || inputs.data_source == 'synthetic'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU-only dependencies
        run: pip install -r requirements.txt
      - name: Regenerate checked-in CPU notebooks
        run: |
          python tools/build_notebooks.py
          git diff --exit-code -- notebooks
      - name: Unit tests
        run: pytest -q
      - name: Execute CPU notebooks
        run: |
          mkdir -p artifacts/notebooks
          for notebook in notebooks/*.ipynb; do
            stem=$(basename "$notebook" .ipynb)
            jupyter nbconvert --to notebook --execute "$notebook" \
              --output "$stem.ipynb" \
              --output-dir artifacts/notebooks \
              --ExecutePreprocessor.timeout=240
          done
      - uses: actions/upload-artifact@v4
        with:
          name: executed-cpu-notebooks
          path: artifacts/notebooks

  alpaca-minute-bars:
    if: github.event_name == 'workflow_dispatch' && inputs.data_source == 'alpaca'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install data-client dependencies
        run: pip install -r requirements.txt
      - name: Verify credentials are configured
        run: |
          test -n "$ALPACA_API_KEY"
          test -n "$ALPACA_SECRET_KEY"
      - name: Download one-minute bars only
        run: |
          python -m cufolio_cpu.alpaca \
            --symbols "${{ inputs.universe_file }}" \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --output artifacts/alpaca_minute_bars.csv
      - uses: actions/upload-artifact@v4
        with:
          name: alpaca-minute-bars
          path: artifacts/alpaca_minute_bars.csv

  yfinance-research:
    if: github.event_name == 'workflow_dispatch' && inputs.data_source == 'yfinance'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU-only dependencies
        run: pip install -r requirements.txt
      - name: Select research universe
        run: |
          if [ "${{ inputs.universe_source }}" = "sp500_wikipedia" ]; then
            python -m cufolio_cpu.universe --output artifacts/current_sp500_universe.csv
            echo "UNIVERSE_FILE=artifacts/current_sp500_universe.csv" >> "$GITHUB_ENV"
          else
            echo "UNIVERSE_FILE=${{ inputs.universe_file }}" >> "$GITHUB_ENV"
          fi
      - name: Download regular-session Yahoo Finance intraday bars
        run: |
          python -m cufolio_cpu.yfinance_data \
            --symbols "$UNIVERSE_FILE" \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --interval "${{ inputs.yfinance_interval }}" \
            --output artifacts/yfinance_intraday_bars.csv \
            --report artifacts/yfinance_download_report.csv
      - name: Aggregate daily returns and calculate research weights
        run: |
          if [ "${{ inputs.yfinance_interval }}" = "15m" ]; then
            MIN_BARS_PER_SESSION=20
          else
            MIN_BARS_PER_SESSION=300
          fi
          python -m cufolio_cpu.research \
            --input artifacts/yfinance_intraday_bars.csv \
            --output-dir artifacts/research \
            --max-weight "${{ inputs.max_weight }}" \
            --min-bars-per-session "$MIN_BARS_PER_SESSION" \
            --allow-insufficient
      - name: Validate forward 500-minute research candidates
        run: |
          python -m cufolio_cpu.intraday_forward \
            --input artifacts/yfinance_intraday_bars.csv \
            --interval "${{ inputs.yfinance_interval }}" \
            --output-dir artifacts/forward_500m_research \
            --horizon-minutes 500 \
            --top-n 20 \
            --max-weight 0.10
      - uses: actions/upload-artifact@v4
        with:
          name: yfinance-intraday-return-research
          path: artifacts

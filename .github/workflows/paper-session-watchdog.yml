name: 24/7 hourly paper runner watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cufolio-hourly-paper-24x7-watchdog
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Monitor the actual 24/7 hourly paper runner
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs="$(gh run list --repo "$REPOSITORY" --workflow 'hourly-paper-24x7.yml' --limit 20 --json status,conclusion,updatedAt)"
          RUNS="$runs" python - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone

          runs = json.loads(os.environ["RUNS"])
          active = {"queued", "in_progress", "pending", "requested", "waiting"}
          if any(run["status"] in active for run in runs):
              print("WATCHDOG OK | 24/7 hourly paper runner is active or queued.")
              raise SystemExit(0)
          if runs:
              latest = max(runs, key=lambda run: run["updatedAt"])
              if latest["conclusion"] == "success":
                  completed = datetime.fromisoformat(latest["updatedAt"].replace("Z", "+00:00"))
                  age = (datetime.now(timezone.utc) - completed).total_seconds()
                  if age < 600:
                      print(f"WATCHDOG WAIT | last runner succeeded {age:.0f}s ago; allowing normal handoff.")
                      raise SystemExit(0)
          print("WATCHDOG RECOVERY REQUIRED | no active 24/7 hourly paper runner.")
          PY
          gh workflow run hourly-paper-24x7.yml --repo "$REPOSITORY" --ref main -f run_seconds=20700
          echo "WATCHDOG DISPATCHED | 24/7 hourly paper runner recovery queued."

name: 24/7 five-minute paper runner watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cufolio-five-minute-paper-24x7-watchdog
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Monitor the actual 24/7 five-minute paper runner
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs="$(gh run list --repo "$REPOSITORY" --workflow 'hourly-paper-24x7.yml' --limit 20 --json databaseId,status,conclusion,createdAt,updatedAt,headSha,url)"
          assessment="$(RUNS="$runs" python - <<'PY'
          import json, os
          from datetime import datetime, timezone

          runs = json.loads(os.environ["RUNS"])
          active = {"queued", "in_progress", "pending", "requested", "waiting"}
          now = datetime.now(timezone.utc)

          def age_seconds(timestamp):
              return max(0, int((now - datetime.fromisoformat(timestamp.replace("Z", "+00:00"))).total_seconds()))

          def emit(decision, run, age):
              print("|".join((
                  decision,
                  str(run.get("databaseId", "none")),
                  str(run.get("status", "none")),
                  str(run.get("conclusion") or "none"),
                  str(run.get("updatedAt", "none")),
                  str(age),
                  str(run.get("headSha", "none"))[:12],
                  str(run.get("url", "none")),
              )))

          active_runs = [run for run in runs if run["status"] in active]
          if active_runs:
              latest = max(active_runs, key=lambda run: run["createdAt"])
              emit("ok", latest, age_seconds(latest["createdAt"]))
          elif runs:
              latest = max(runs, key=lambda run: run["updatedAt"])
              if latest["conclusion"] == "success":
                  age = age_seconds(latest["updatedAt"])
                  if age < 600:
                      emit("wait", latest, age)
                  else:
                      emit("recover", latest, age)
              else:
                  emit("recover", latest, age_seconds(latest["updatedAt"]))
          else:
              emit("recover", {}, 0)
          PY
          )"
          IFS='|' read -r decision run_id run_status conclusion updated_at age_seconds head_sha run_url <<< "$assessment"
          echo "WATCHDOG STATUS | runner=${run_id} status=${run_status} conclusion=${conclusion} age=${age_seconds}s updated=${updated_at} sha=${head_sha} url=${run_url}"
          {
            echo "### 24/7 five-minute paper watchdog"
            echo "- Decision: \`${decision}\`"
            echo "- Runner: [${run_id}](${run_url}) — status \`${run_status}\`, age ${age_seconds}s, SHA \`${head_sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$decision" in
            ok)
              echo "WATCHDOG OK | 24/7 five-minute paper runner is active or queued; no duplicate dispatch."
              exit 0
              ;;
            wait)
              echo "WATCHDOG WAIT | last runner succeeded recently; allowing normal handoff."
              exit 0
              ;;
            recover)
              echo "WATCHDOG RECOVERY REQUIRED | no active 24/7 five-minute paper runner."
              ;;
            *)
              echo "::error::Watchdog produced an invalid decision: $decision"
              exit 1
              ;;
          esac
          gh workflow run hourly-paper-24x7.yml --repo "$REPOSITORY" --ref main -f run_seconds=20700
          echo "WATCHDOG DISPATCHED | 24/7 five-minute paper runner recovery queued."

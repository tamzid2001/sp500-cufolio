name: Report Latest V2 Artifact

on:
  push:
    branches:
      - improve-forward-ml-metrics
    paths:
      - ".github/workflows/report-v2-artifact.yml"

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report latest V2 run and artifact
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'generate-tomorrow-portfolio-v2.yml';
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              { owner, repo, workflow_id, per_page: 100 }
            );
            const ordered = runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const rows = [];
            for (const run of ordered.slice(0, 20)) {
              const artifactsResponse = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              });
              const matching = artifactsResponse.data.artifacts.filter(
                artifact => artifact.name === 'tomorrow-long-only-portfolio-v2'
              );
              rows.push({
                run_id: run.id,
                run_number: run.run_number,
                status: run.status,
                conclusion: run.conclusion,
                event: run.event,
                head_sha: run.head_sha,
                created_at: run.created_at,
                html_url: run.html_url,
                artifacts: matching.map(artifact => ({
                  id: artifact.id,
                  name: artifact.name,
                  expired: artifact.expired,
                  size_in_bytes: artifact.size_in_bytes,
                  created_at: artifact.created_at,
                })),
              });
            }
            const body = [
              '<!-- v2-artifact-report -->',
              '## Generate Tomorrow Portfolio V2 artifact report',
              '',
              '```json',
              JSON.stringify(rows, null, 2),
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: 25,
              body,
            });

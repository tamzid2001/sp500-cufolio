name: Five-minute intraday forecast audit

on:
  workflow_dispatch:
    inputs:
      session_date:
        description: "Completed New York session to audit (YYYY-MM-DD); blank uses yesterday and falls back to the latest prior trading session"
        type: string
        default: ""
      history_calendar_days:
        description: "Calendar days of prior 1-minute IEX training history to download"
        type: string
        default: "45"
      top_n:
        description: "Maximum long-only candidates; must support the concentration cap"
        type: string
        default: "20"
      max_weight:
        description: "Maximum target weight per asset"
        type: string
        default: "0.10"

permissions:
  contents: read

concurrency:
  group: five-minute-intraday-forecast-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      REQUESTED_SESSION_DATE: ${{ inputs.session_date }}
      HISTORY_CALENDAR_DAYS: ${{ inputs.history_calendar_days || '45' }}
      TOP_N: ${{ inputs.top_n || '20' }}
      MAX_WEIGHT: ${{ inputs.max_weight || '0.10' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: pip install -r requirements.txt
      - name: Verify five-minute audit causality and reconciliation
        run: pytest -q tests/test_alpaca.py tests/test_intraday_forecast_audits.py
      - name: Resolve the completed session and historical data window
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          new_york = ZoneInfo("America/New_York")
          requested = os.environ.get("REQUESTED_SESSION_DATE", "").strip()
          target = datetime.fromisoformat(requested).date() if requested else (datetime.now(new_york).date() - timedelta(days=1))
          history_days = int(os.environ["HISTORY_CALENDAR_DAYS"])
          if history_days < 20:
              raise SystemExit("history_calendar_days must be at least 20")
          print(f"SESSION_DATE={target.isoformat()}")
          print(f"HISTORY_START={(target - timedelta(days=history_days)).isoformat()}")
          print(f"HISTORY_END={(target + timedelta(days=1)).isoformat()}")
          PY
      - name: Select the current S&P 500 convenience universe
        run: python -m cufolio_cpu.universe --output artifacts/current_sp500_universe.csv
      - name: Download read-only IEX one-minute history
        run: |
          test -n "$ALPACA_API_KEY"
          test -n "$ALPACA_SECRET_KEY"
          python -m cufolio_cpu.alpaca \
            --symbols artifacts/current_sp500_universe.csv \
            --start "$HISTORY_START" \
            --end "$HISTORY_END" \
            --output artifacts/one_minute_iex_history.csv.gz
      - name: Build every causal five-minute portfolio forecast from primary IEX data
        run: |
          python -m cufolio_cpu.five_minute_intraday_backtest \
            --input artifacts/one_minute_iex_history.csv.gz \
            --output-dir artifacts/five_minute_forecast_audit \
            --session-date "$SESSION_DATE" \
            --top-n "$TOP_N" \
            --max-weight "$MAX_WEIGHT" \
            --lookback-observations 780 \
            --min-training-sessions 10 \
            --min-covariance-scenarios 500
      - name: Select only missing realized endpoints for yfinance repair
        run: |
          python - <<'PY'
          import pandas as pd

          holdings = pd.read_csv("artifacts/five_minute_forecast_audit/five_minute_forecast_holdings.csv")
          symbols = (
              holdings.loc[holdings["realized_asset_simple_return"].isna(), ["symbol"]]
              .drop_duplicates()
              .sort_values("symbol")
          )
          symbols.to_csv("artifacts/yfinance_missing_endpoint_symbols.csv", index=False)
          print(f"Requesting yfinance endpoint repair for {len(symbols)} symbols")
          PY
      - name: Download yfinance one-minute endpoint fallback
        run: |
          python - <<'PY'
          import os
          import pandas as pd

          from cufolio_cpu.alpaca import download_yfinance_minute_bars

          symbols = pd.read_csv("artifacts/yfinance_missing_endpoint_symbols.csv")["symbol"].dropna().astype(str).tolist()
          output = "artifacts/yfinance_endpoint_fallback_1m.csv.gz"
          if not symbols:
              pd.DataFrame(columns=["timestamp", "symbol", "close"]).to_csv(output, index=False)
              print("No yfinance endpoint repair was needed")
          else:
              start = pd.Timestamp(f"{os.environ['SESSION_DATE']} 09:29", tz="America/New_York")
              end = pd.Timestamp(f"{os.environ['SESSION_DATE']} 16:00", tz="America/New_York")
              try:
                  bars = download_yfinance_minute_bars(symbols, start, end)
              except Exception as error:
                  # The audit stays valid and reports incomplete coverage if
                  # a credential-free fallback provider is unavailable.
                  print(f"yfinance endpoint fallback unavailable: {error}")
                  bars = pd.DataFrame(columns=["timestamp", "symbol", "close"])
              bars.to_csv(output, index=False)
              print(f"Wrote {len(bars):,} fallback bars for {bars['symbol'].nunique() if not bars.empty else 0} symbols")
          PY
      - name: Reconcile five-minute outcomes with yfinance fallback
        run: |
          python -m cufolio_cpu.five_minute_intraday_backtest \
            --input artifacts/one_minute_iex_history.csv.gz \
            --fallback-input artifacts/yfinance_endpoint_fallback_1m.csv.gz \
            --output-dir artifacts/five_minute_forecast_audit \
            --session-date "$SESSION_DATE" \
            --top-n "$TOP_N" \
            --max-weight "$MAX_WEIGHT" \
            --lookback-observations 780 \
            --min-training-sessions 10 \
            --min-covariance-scenarios 500
      - name: Publish the detailed audit report in the run summary
        run: sed -n '1,220p' artifacts/five_minute_forecast_audit/five_minute_forecast_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: five-minute-intraday-forecast-audit
          path: artifacts
          if-no-files-found: error
          retention-days: 30

name: Report V2 Backtest Artifacts

on:
  push:
    branches:
      - improve-forward-ml-metrics
    paths:
      - ".github/workflows/report-v2-backtest-artifacts.yml"

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Inventory V2 and backtest workflows
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflows = await github.paginate(
              github.rest.actions.listRepoWorkflows,
              { owner, repo, per_page: 100 }
            );
            const selected = workflows.filter(w =>
              /v2|backtest|three.?month/i.test(`${w.name} ${w.path}`)
            );
            const report = [];
            for (const workflow of selected) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                { owner, repo, workflow_id: workflow.id, per_page: 100 }
              );
              const runRows = [];
              for (const run of runs.slice(0, 20)) {
                const artifactsResponse = await github.rest.actions.listWorkflowRunArtifacts({
                  owner,
                  repo,
                  run_id: run.id,
                  per_page: 100,
                });
                runRows.push({
                  run_id: run.id,
                  run_number: run.run_number,
                  name: run.name,
                  display_title: run.display_title,
                  status: run.status,
                  conclusion: run.conclusion,
                  event: run.event,
                  head_branch: run.head_branch,
                  head_sha: run.head_sha,
                  created_at: run.created_at,
                  html_url: run.html_url,
                  artifacts: artifactsResponse.data.artifacts.map(a => ({
                    id: a.id,
                    name: a.name,
                    expired: a.expired,
                    size_in_bytes: a.size_in_bytes,
                    created_at: a.created_at,
                  })),
                });
              }
              report.push({
                workflow_id: workflow.id,
                workflow_name: workflow.name,
                workflow_path: workflow.path,
                state: workflow.state,
                html_url: workflow.html_url,
                runs: runRows,
              });
            }
            const body = [
              '<!-- v2-backtest-artifact-report -->',
              '## V2 / backtest workflow artifact inventory',
              '',
              '```json',
              JSON.stringify(report, null, 2),
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: 25,
              body,
            });

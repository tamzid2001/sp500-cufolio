name: Prepare next-session paper target

on:
  schedule:
    # GitHub Actions cron is UTC. 19:18 UTC is 15:18 ET during daylight time
    # (and 14:18 ET during standard time), safely before the 16:00 ET close.
    # This job solves tomorrow's target before the near-close transition cycle.
    - cron: "18 19 * * 1-5"
  workflow_dispatch:
    inputs:
      top_n:
        description: "Maximum long-only candidates passed to the optimizer"
        type: string
        default: "20"

permissions:
  contents: write

concurrency:
  group: cufolio-prepare-daily-target
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify paper credentials are available
        run: |
          test -n "$ALPACA_API_KEY"
          test -n "$ALPACA_SECRET_KEY"
      - name: Prepare tomorrow's full-S&P-500 15-minute forward target
        run: |
          python -m cufolio_cpu.prepare_daily_target \
            --mode paper \
            --output assets/active_daily_target.csv \
            --status assets/active_daily_target_status.json \
            --lookback-calendar-days 60 \
            --horizon-minutes 500 \
            --top-n "${{ inputs.top_n || '20' }}" \
            --max-weight 0.10
      - name: Commit the dated target for the next market session
        shell: bash
        run: |
          if git diff --quiet -- assets/active_daily_target.csv assets/active_daily_target_status.json; then
            echo "No next-session target was produced."
            exit 0
          fi
          git config user.name "cufolio paper target bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/active_daily_target.csv assets/active_daily_target_status.json
          git commit -m "Prepare next-session paper target"
          git push
